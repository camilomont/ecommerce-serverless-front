<section class="space-y-6">
  <div class="rounded-2xl bg-white/80 backdrop-blur p-5 shadow-sm border border-slate-200">
    <h2 class="text-xl font-semibold text-slate-900">Crear usuario</h2>
    <div class="mt-4 grid gap-3 md:grid-cols-3">
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="form.userId" placeholder="userId" />
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="form.name" placeholder="name" />
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="form.email" placeholder="email" type="email" />
    </div>
    <div class="mt-4 flex gap-3">
      <button class="px-4 py-2 rounded-lg font-semibold text-white bg-amber-600 hover:bg-amber-700 transition" (click)="createUser()">Guardar usuario</button>
      <button class="px-4 py-2 rounded-lg font-semibold text-amber-700 bg-amber-100 border border-amber-300 hover:bg-amber-200 transition" (click)="loadUsers()">Refrescar lista</button>
    </div>
    <p *ngIf="message" class="mt-3 text-emerald-700 text-sm">{{ message }}</p>
    <p *ngIf="error" class="mt-3 text-rose-700 text-sm">{{ error }}</p>
  </div>

  <div class="rounded-2xl bg-white/80 backdrop-blur p-5 shadow-sm border border-slate-200">
    <div class="flex items-center justify-between gap-3">
      <h3 class="text-lg font-semibold text-slate-900">Usuarios</h3>
    </div>
    <div class="mt-4 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="text-left text-slate-500 border-b border-slate-200">
          <tr>
            <th class="py-2 pr-4">userId</th>
            <th class="py-2 pr-4">name</th>
            <th class="py-2 pr-4">email</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users" class="border-b border-slate-100">
            <td class="py-2 pr-4">{{ user.userId }}</td>
            <td class="py-2 pr-4">{{ user.name }}</td>
            <td class="py-2 pr-4">{{ user.email }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
