<section class="space-y-6">
  <div class="rounded-2xl bg-white/80 backdrop-blur p-5 shadow-sm border border-slate-200">
    <h2 class="text-xl font-semibold text-slate-900">Crear usuario</h2>
    <div class="mt-4 grid gap-3 md:grid-cols-3">
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="form.userId" placeholder="userId" />
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="form.name" placeholder="name" />
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="form.email" placeholder="email" type="email" />
    </div>
    <div class="mt-4 flex gap-3">
      <button class="px-4 py-2 rounded-lg font-semibold text-white bg-amber-600 hover:bg-amber-700 transition" (click)="createUser()">Guardar usuario</button>
      <button class="px-4 py-2 rounded-lg font-semibold text-amber-700 bg-amber-100 border border-amber-300 hover:bg-amber-200 transition" (click)="loadUsers()">Refrescar lista</button>
    </div>

    <div *ngIf="editingUserId" class="mt-4 rounded-xl border border-emerald-200 bg-emerald-50/70 p-4">
      <p class="text-sm font-semibold text-emerald-800">Editando usuario: {{ editingUserId }}</p>
      <div class="mt-3 grid gap-3 md:grid-cols-2">
        <input class="px-3 py-2 border border-emerald-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-300 transition" [(ngModel)]="editForm.name" placeholder="name" />
        <input class="px-3 py-2 border border-emerald-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-300 transition" [(ngModel)]="editForm.email" placeholder="email" type="email" />
      </div>
      <div class="mt-3 flex gap-2">
        <button class="px-4 py-2 rounded-lg font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition" (click)="saveEditUser()">Guardar cambios</button>
        <button class="px-4 py-2 rounded-lg font-semibold text-slate-700 bg-white border border-slate-300 hover:bg-slate-100 transition" (click)="cancelEditUser()">Cancelar</button>
      </div>
    </div>

    <p *ngIf="message" class="mt-3 text-emerald-700 text-sm">{{ message }}</p>
    <p *ngIf="error" class="mt-3 text-rose-700 text-sm">{{ error }}</p>
  </div>

  <div class="rounded-2xl bg-white/80 backdrop-blur p-5 shadow-sm border border-slate-200">
    <div class="flex items-center justify-between gap-3">
      <h3 class="text-lg font-semibold text-slate-900">Usuarios</h3>
    </div>
    <div class="mt-4 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="text-left text-slate-500 border-b border-slate-200">
          <tr>
            <th class="py-2 pr-4">userId</th>
            <th class="py-2 pr-4">name</th>
            <th class="py-2 pr-4">email</th>
            <th class="py-2 pr-4">acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users" class="border-b border-slate-100">
            <td class="py-2 pr-4">{{ user.userId }}</td>
            <td class="py-2 pr-4">{{ user.name }}</td>
            <td class="py-2 pr-4">{{ user.email }}</td>
            <td class="py-2 pr-4">
              <div class="flex gap-2">
                <button class="px-3 py-1 rounded-md text-xs font-semibold text-emerald-700 bg-emerald-100 border border-emerald-300 hover:bg-emerald-200 transition" (click)="editUser(user)">Editar</button>
                <button class="px-3 py-1 rounded-md text-xs font-semibold text-rose-700 bg-rose-100 border border-rose-300 hover:bg-rose-200 transition" (click)="requestDeleteUser(user)">Eliminar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="deletingUser" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 px-4">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
      <h4 class="text-lg font-bold text-slate-900">Confirmar eliminacion</h4>
      <p class="mt-2 text-sm text-slate-600">
        Vas a eliminar el usuario <span class="font-semibold text-slate-900">{{ deletingUser.userId }}</span>.
        Esta accion no se puede deshacer.
      </p>
      <div class="mt-5 flex justify-end gap-2">
        <button class="px-4 py-2 rounded-lg font-semibold text-slate-700 bg-white border border-slate-300 hover:bg-slate-100 transition" (click)="cancelDeleteUser()">Cancelar</button>
        <button class="px-4 py-2 rounded-lg font-semibold text-white bg-rose-600 hover:bg-rose-700 transition" (click)="confirmDeleteUser()">Eliminar</button>
      </div>
    </div>
  </div>
</section>
