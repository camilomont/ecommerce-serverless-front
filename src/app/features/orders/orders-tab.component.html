<section class="space-y-6">
  <div class="rounded-2xl bg-white/80 backdrop-blur p-5 shadow-sm border border-slate-200">
    <h2 class="text-xl font-semibold text-slate-900">Registrar compra</h2>
    <div *ngIf="error" class="mt-4 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-rose-700 text-sm">
      {{ error }}
    </div>
    <div *ngIf="message" class="mt-4 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-emerald-700 text-sm">
      {{ message }}
    </div>
    <div class="mt-4 grid gap-3 md:grid-cols-3">
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="purchaseForm.userId" placeholder="userId" />
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="purchaseForm.productId" placeholder="productId" />
      <input class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="purchaseForm.quantity" type="number" min="1" step="1" placeholder="quantity" />
    </div>
    <div class="mt-4 flex gap-3">
      <button class="px-4 py-2 rounded-lg font-semibold text-white bg-amber-600 hover:bg-amber-700 transition" (click)="createPurchase()">Guardar compra</button>
    </div>
  </div>

  <div class="rounded-2xl bg-white/80 backdrop-blur p-5 shadow-sm border border-slate-200">
    <h3 class="text-lg font-semibold text-slate-900">Consultar compras por usuario</h3>
    <div class="mt-4 flex flex-col md:flex-row gap-3">
      <input class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-300 transition" [(ngModel)]="lookupUserId" placeholder="userId" />
      <button class="px-4 py-2 rounded-lg font-semibold text-amber-700 bg-amber-100 border border-amber-300 hover:bg-amber-200 transition" (click)="loadPurchases()">Buscar</button>
      <button class="px-4 py-2 rounded-lg font-semibold text-amber-700 bg-amber-100 border border-amber-300 hover:bg-amber-200 transition" (click)="refreshPurchases()">Refrescar lista</button>
    </div>

    <div class="mt-4 overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="text-left text-slate-500 border-b border-slate-200">
          <tr>
            <th class="py-2 pr-4">userId</th>
            <th class="py-2 pr-4">productId</th>
            <th class="py-2 pr-4">quantity</th>
            <th class="py-2 pr-4">purchaseDate</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let purchase of purchases" class="border-b border-slate-100">
            <td class="py-2 pr-4">{{ purchase.userId }}</td>
            <td class="py-2 pr-4">{{ purchase.productId }}</td>
            <td class="py-2 pr-4">{{ purchase.quantity }}</td>
            <td class="py-2 pr-4">{{ purchase.purchaseDate | date:'medium' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
